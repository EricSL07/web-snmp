services:
  # Aplicação Next.js em modo desenvolvimento
  web-app-dev:
    image: node:18-alpine
    container_name: web-snmp-dev
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://app:apppass@postgres:5432/appdb?schema=public"
      ANSIBLE_API_URL: "http://ansible-api:5000"
      ZABBIX_URL: "http://zabbix-web:8080/api_jsonrpc.php"
      ZABBIX_USER: "Admin"
      ZABBIX_PASSWORD: "zabbix"
      JWT_SECRET: "sua-chave-secreta-muito-segura"
      # Garantir que o Next.js detecte mudanças em volumes montados
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -lc "mkdir -p node_modules && rm -rf node_modules/* node_modules/.??* 2>/dev/null || true; (npm ci --no-audit --no-fund || (echo 'npm ci failed; trying npm install' && npm install --no-audit --no-fund)) && for i in $(seq 1 30); do npx prisma migrate deploy && break || (echo 'Waiting for Postgres...' && sleep 2); done; npx prisma generate && npm run dev -- -H 0.0.0.0 -p 3000"
    depends_on:
      - postgres
      - zabbix-web
    networks:
      - web-snmp-network

  # Banco PostgreSQL principal
  postgres:
    image: postgres:16
    container_name: web-snmp-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - web-snmp-network

  # API do Ansible
  ansible-api:
    build: ./ansible-api
    container_name: web-snmp-ansible-api-dev
    restart: unless-stopped
    environment:
      ANSIBLE_INVENTORY: /ansible/inventories/dev/hosts.ini
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ansible:/ansible
      - ./ansible-api:/app
    ports:
      - "5000:5000"
    working_dir: /app
    command: sh -lc "pip show flask >/dev/null 2>&1 || pip install --no-cache-dir flask && flask run --host 0.0.0.0 --port 5000"
    networks:
      - web-snmp-network


  # Banco PostgreSQL para Zabbix
  zabbix-postgres:
    image: postgres:15
    container_name: web-snmp-zabbix-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-dev:/var/lib/postgresql/data
    networks:
      - web-snmp-network

  # Servidor Zabbix
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: web-snmp-zabbix-server-dev
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    depends_on:
      - zabbix-postgres
    ports:
      - "10051:10051"
    networks:
      - web-snmp-network

  # Interface Web do Zabbix
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: web-snmp-zabbix-web-dev
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    depends_on:
      # Lines 116-117 omitted
      - zabbix-server
    ports:
      - "8080:8080"
    networks:
      - web-snmp-network

  # Prisma Studio para desenvolvimento
  prisma-studio:
    image: node:18-alpine
    container_name: web-snmp-prisma-studio-dev
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://app:apppass@postgres:5432/appdb?schema=public"
    volumes:
      - .:/app
    networks:
      - web-snmp-network
    ports:
      - "5555:5555"
    depends_on:
      - postgres
    command: sh -lc "for i in $(seq 1 30); do nc -z postgres 5432 && break || (echo 'Waiting for Postgres for Studio...' && sleep 2); done; npx prisma studio --hostname 0.0.0.0 --schema ./prisma/schema.prisma"
  
volumes:
  pgdata-dev:
  zabbix-db-dev:
  node_modules_dev:


networks:
  web-snmp-network:
    driver: bridge
    